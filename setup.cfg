[metadata]
license_file = LICENSE.txt

[flake8]
max-line-length = 100
exclude = .git,__pycache__,build,dist,notebooks,dbt/target
ignore = E203,W503
per-file-ignores =
    src/meridian/utils/nordfalk_codes.py:E501
    src/meridian/pipelines/data_engineering/nodes.py:C901
    tests/conftest.py:E501

[isort]
line_length = 100
multi_line_output = 3
include_trailing_comma = True
known_first_party = meridian

[tool:pytest]
testpaths = tests
addopts = --no-cov-on-fail -ra
filterwarnings =
    ignore::DeprecationWarning:pandas.*
    ignore::FutureWarning:sklearn.*

[mypy]
python_version = 3.8
ignore_missing_imports = True
follow_imports = skip
